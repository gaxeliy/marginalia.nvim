name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Neovim ${{ matrix.nvim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: ['v0.10.4', 'v0.11.7', 'v0.12.5', 'stable', 'nightly']
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Neovim version
        run: nvim --version | head -1
      - name: Test suite
        run: tests/run.sh

  mutation:
    name: Mutation testing (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Mutation suite
        run: tests/mutate.sh
